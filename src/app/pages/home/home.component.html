<div class="page" id="top">
  <div class="announcement">Prototype visuel · Des événements qui font du bien</div>

  <app-site-header (accountRequested)="openAccount()" />

  <main>
    <app-hero-section (organizerRequested)="openOrganizer()" />

    <app-event-explorer
      [events]="events"
      (eventSelected)="openEvent($event)"
    />

    <app-experience-section />

    <app-organizer-cta (organizerRequested)="openOrganizer()" />

    <app-newsletter />
  </main>

  <app-site-footer />

  <app-event-modal
    [event]="selectedEvent"
    (closed)="closeEvent()"
    (accountRequested)="openAccount()"
  />

  <app-account-modal
    [open]="accountModalOpen"
    title="Gardez une place pour les belles idées."
    description="Le compte POP UP arrive bientôt. Laissez votre e-mail pour recevoir les premières invitations."
    (closed)="closeAccount()"
  />

  <app-account-modal
    [open]="organizerModalOpen"
    title="Faites passer votre idée du brouillon au vrai moment."
    description="Dans cette première version, ce formulaire est visuel. La prochaine étape pourra accueillir un vrai espace organisateur."
    (closed)="closeOrganizer()"
  />
</div>
