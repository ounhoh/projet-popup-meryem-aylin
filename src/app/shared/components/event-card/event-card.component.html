<article class="event-card">
  <div class="event-image">
    <img [src]="event.image" [alt]="event.imageAlt" loading="lazy" />
    <span class="event-tag">{{ event.type }}</span>
    <button
      class="event-save"
      type="button"
      [class.is-saved]="saved"
      [attr.aria-label]="saved ? 'Événement enregistré' : 'Enregistrer l’événement'"
      (click)="toggleSaved($event)"
    >
      {{ saved ? '♥' : '♡' }}
    </button>
  </div>

  <div class="event-content">
    <div class="event-title-row">
      <h3>{{ event.title }}</h3>
      <span class="event-arrow" aria-hidden="true">↗</span>
    </div>
    <div class="event-meta">
      <span>⌖ {{ event.city }}</span>
      <span>◷ {{ event.date }} · {{ event.time }}</span>
    </div>
    <button class="card-action" type="button" (click)="selected.emit(event)">
      <span>Voir l’événement</span>
      <span aria-hidden="true">→</span>
    </button>
  </div>
</article>
